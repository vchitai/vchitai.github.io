<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Quorum mark">
  <!-- absent (outline) members -->
  <circle cx="40" cy="45.86" r="7" fill="none" stroke="#1a2028" stroke-width="2.5"/>
  <circle cx="16" cy="32" r="7" fill="none" stroke="#1a2028" stroke-width="2.5"/>
  <circle cx="40" cy="18.14" r="7" fill="none" stroke="#1a2028" stroke-width="2.5"/>
  <!-- present members = quorum reached -->
  <circle cx="32" cy="32" r="7" fill="#ca5843"/>
  <circle cx="48" cy="32" r="7" fill="#ca5843"/>
  <circle cx="24" cy="45.86" r="7" fill="#ca5843"/>
  <circle cx="24" cy="18.14" r="7" fill="#ca5843"/>
</svg>
